<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · Wireframe Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #111;
    --bg-elev:   #1a1a1a;
    --line:      #222;
    --accent:    #f7c600;
    --text:      #EDEDED;
    --text-dim:  #A0A0A0;

    --font-title: 'Archivo Black', system-ui, sans-serif;
    --font-body:  'Inter', system-ui, sans-serif;

    --fs-eyebrow: 0.7rem;
    --fs-body:    clamp(0.95rem, 0.9rem + 0.3vw, 1.05rem);
    --fs-meta:    0.75rem;

    --s-1: 4px;  --s-2: 8px;   --s-3: 12px;
    --s-4: 16px; --s-5: 24px;  --s-6: 32px;
    --s-7: 48px; --s-8: 64px;  --s-9: 96px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  h1 { margin: 0; font-family: var(--font-title); font-weight: 400; line-height: 0.9; letter-spacing: -0.03em; }

  /* ---------- hero base ---------- */
  .hero {
    position: relative;
    min-height: 100svh;
    min-height: 100vh;
    padding: var(--s-9) var(--s-5) 120px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* etiqueta de test (no forma parte del diseño) */
  .test-label {
    position: absolute;
    top: var(--s-4);
    left: 50%;
    transform: translateX(-50%);
    font-family: ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    padding: 5px 12px;
    border-radius: 2px;
    z-index: 30;
  }

  .eyebrow {
    font-size: var(--fs-eyebrow);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
  }

  /* ---------- V1 · MONUMENTAL ---------- */
  .v1 .display {
    font-size: clamp(3.2rem, 15vw, 9.5rem);
    line-height: 0.84;
    letter-spacing: -0.045em;
    color: var(--text);
    text-transform: uppercase;
  }
  .v1 .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--s-4);
    border-top: 1px solid var(--line);
    padding-top: var(--s-4);
    font-size: var(--fs-meta);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .v1 .dot {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 6px;
    vertical-align: middle;
  }

  /* ---------- V2 · EDITORIAL ---------- */
  .v2 .top { }
  .v2 .rule {
    width: 36px; height: 2px;
    background: var(--accent);
    margin-bottom: var(--s-5);
  }
  .v2 .display {
    font-size: clamp(2rem, 9vw, 4.8rem);
    line-height: 0.98;
    letter-spacing: -0.03em;
    color: var(--text);
    margin: 0 0 var(--s-5);
    max-width: 12ch;
  }
  .v2 .lead {
    font-size: clamp(1rem, 0.95rem + 0.4vw, 1.15rem);
    color: var(--text);
    max-width: 34ch;
    margin: 0 0 var(--s-7);
    line-height: 1.5;
  }
  .v2 .hint {
    display: inline-flex;
    align-items: center;
    gap: var(--s-3);
    font-size: var(--fs-meta);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .v2 .arrow {
    display: inline-block;
    width: 22px; height: 1px;
    background: var(--accent);
    position: relative;
  }
  .v2 .arrow::after {
    content: '';
    position: absolute;
    right: 0; top: -3px;
    width: 6px; height: 6px;
    border-top: 1px solid var(--accent);
    border-right: 1px solid var(--accent);
    transform: rotate(45deg);
  }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-around;
    background: var(--bg-elev);
    border-top: 1px solid var(--line);
    padding: var(--s-3) var(--s-4);
    z-index: 10;
  }
  .nav-item {
    position: relative;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: var(--s-2);
  }
  .nav-item.active { color: var(--text); }
  .nav-item.active::after {
    content: '';
    position: absolute;
    left: 50%; transform: translateX(-50%);
    bottom: -2px;
    width: 18px; height: 2px;
    background: var(--accent);
  }
</style>
</head>
<body>

<!-- ===================== V1 ===================== -->
<section class="hero v1">
  <div class="test-label">V1 · Monumental</div>

  <div class="eyebrow">@nelsondesousa11</div>

  <h1 class="display">Nelson<br>De Sousa</h1>

  <div class="meta">
    <span>Athlete<span class="dot"></span>Builder<span class="dot"></span>Learner</span>
    <span>VE</span>
  </div>
</section>

<!-- ===================== V2 ===================== -->
<section class="hero v2">
  <div class="test-label">V2 · Editorial</div>

  <div class="top">
    <div class="rule"></div>
    <div class="eyebrow">Personal Website</div>
  </div>

  <div>
    <h1 class="display">Nelson De Sousa</h1>
    <p class="lead">Athlete, builder, lifelong learner. A personal archive in progress.</p>
    <a class="hint" href="#">
      Enter
      <span class="arrow"></span>
    </a>
  </div>

  <div></div>
</section>

<!-- ===================== NAV ===================== -->
<nav class="bottom-nav">
  <a class="nav-item active" href="#">Home</a>
  <a class="nav-item" href="#">About</a>
  <a class="nav-item" href="#">Sport</a>
  <a class="nav-item" href="#">Contact</a>
</nav>

</body>
</html>
