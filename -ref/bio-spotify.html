<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>_ref — spotify heights</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">

<style>
body { padding-bottom: var(--s-9); }

.label {
  font-size: 0.65rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: var(--s-5) var(--s-5) var(--s-2);
  font-weight: 600;
}

.t { border-bottom: 1px solid var(--line); padding: var(--s-5); }

.spotify {
  width: 100%;
  border: 0;
  border-radius: 12px;
  display: block;
}
</style>
</head>
<body>

<p class="label">A — Altura compacta (152px)</p>
<section class="t">
  <iframe class="spotify"
    src="https://open.spotify.com/embed/playlist/1b4klnoCg3ygsD7Cp6JGim"
    width="100%"
    height="152"
    frameBorder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
  </iframe>
</section>

<p class="label">B — Altura expandida (352px)</p>
<section class="t">
  <iframe class="spotify"
    src="https://open.spotify.com/embed/playlist/1b4klnoCg3ygsD7Cp6JGim"
    width="100%"
    height="352"
    frameBorder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
  </iframe>
</section>

</body>
</html>
