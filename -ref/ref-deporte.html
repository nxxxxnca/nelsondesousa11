<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>_ref · C3b 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111; --surface:#1a1a1a; --line:#222; --accent:#f7c600;
    --text:#EDEDED; --text-dim:#A0A0A0;
    --font-title:'Archivo Black', sans-serif;
    --font-body:'Inter', sans-serif;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px;
    --s-6:32px; --s-7:48px; --s-8:64px; --s-9:96px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font-body)}
  body{padding:var(--s-6) var(--s-4) var(--s-9);line-height:1.5}
  img{display:block;max-width:100%}

  .ref-head{padding-bottom:var(--s-4);border-bottom:1px solid var(--line);margin-bottom:var(--s-7)}
  .ref-head h1{font-family:var(--font-title);font-weight:800;letter-spacing:-.03em;font-size:22px;text-transform:uppercase;line-height:1}
  .ref-head p{color:var(--text-dim);font-size:12px;margin-top:var(--s-2)}

  /* Año (etiqueta, igual patrón C3) */
  .year{
    display:inline-block;position:relative;z-index:10;
    font-family:var(--font-title);font-weight:800;letter-spacing:-.03em;
    font-size:30px;line-height:1;text-transform:uppercase;
    background:var(--bg);
    padding:var(--s-1) var(--s-2);
    border-left:3px solid var(--accent);
    margin-bottom:var(--s-5);
  }

  /* Contenedor del collage */
  .stack{position:relative;max-width:520px}

  .ph{
    position:relative;
    background:var(--surface);
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
  }
  .ph img{width:100%;height:100%;object-fit:cover;opacity:.92}

  /* Formatos */
  .ph.sq{aspect-ratio:1/1}    /* cuadrada */
  .ph.vt{aspect-ratio:3/4}    /* vertical  */
  .ph.hz{aspect-ratio:4/3}    /* horizontal */

  /* Etiqueta de referencia (solo para el ref) */
  .ph .tag{
    position:absolute;top:8px;left:8px;z-index:2;
    font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text);background:rgba(0,0,0,.65);
    padding:3px 7px;border-radius:4px;
  }

  /* ===== Cascada diagonal · C3b con formatos mixtos ===== */
  .c3b .ph:nth-child(1){width:66%}                                  /* cuadrada   */
  .c3b .ph:nth-child(2){
    width:56%;margin-left:22%;margin-top:calc(-1 * var(--s-7));     /* vertical   */
    z-index:2;
  }
  .c3b .ph:nth-child(3){
    width:80%;margin-left:20%;margin-top:calc(-1 * var(--s-7));     /* horizontal */
    z-index:3;
  }
</style>
</head>
<body>

<header class="ref-head">
  <h1>_ref · C3b · 2026</h1>
  <p>Cuadrada → vertical → horizontal. Placeholder: <code>media/icon-pic.jpg</code>.</p>
</header>

<section class="c3b">
  <div class="year">2026</div>
  <div class="stack">
    <figure class="ph sq">
      <img src="media/icon-pic.jpg" alt="">
      <figcaption class="tag">1:1 · cuadrada</figcaption>
    </figure>
    <figure class="ph vt">
      <img src="media/raphi.jpg" alt="">
      <figcaption class="tag">3:4 · vertical</figcaption>
    </figure>
    <figure class="ph hz">
      <img src="media/rdr2.jpg" alt="">
      <figcaption class="tag">4:3 · horizontal</figcaption>
    </figure>
  </div>
</section>

</body>
</html>
